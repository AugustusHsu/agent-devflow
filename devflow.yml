# agent-devflow 專案設定。本 repo 自己也是第一個消費者。
# 只有 forge 與 seats（各職位的綁定）是自變數；其餘（PR/MR、CLI、入口檔、skills 目錄、派工方式）
# 都是衍生值，由 devflow/ 下的對照表產生，不在這裡寫（唯一例外：implementer_filler 投影，見下）。
# 規則本體：devflow/WORKFLOW.md。

forge: github          # github | gitlab | gitea（gitea 全表 ⬜，無實例前不可選）

# 職位綁定。職位名以 devflow/seats/ 的五個檔為準，不新增。每個職位一個 filler（填充者）：
# 工具名（對照表在 devflow/coders/、orchestrators/）或 human（由人填）。
# model／reasoning 選填，未填＝用該工具的預設；旗標怎麼寫住對照表，這裡只記意圖。
# filler 只指模型與能力的來源，啟動機制是 launch（值域見 devflow/templates/devflow.yml；省略 ＝ cli）。
# model 是 R10 受測環境的一部分：換模型後，舊模型下驗證的格子依 R9 降為 📝（#17 裁決 4）。
seats:
  implementer:               # 實作位
    filler: claude-code      # claude-code | codex
    model: claude-opus-5[1m] # 顯式 pin：別名 opus 於 2026-09-23T18:55Z 起靜默漂移到 claude-opus-5-5；[1m] 為 1M context 窗
  reviewer:                  # 審查位；建議與 implementer 異廠（R2）。本 repo 審查一律顯式 pin，不讀工具的全域設定
    filler: codex            # codex | claude-code
    launch: agent            # 啟動機制：cli | agent | subagent | human
    instance: dfrev          # launch=agent 時，協調平台上的具名實例
    model: gpt-5.6-sol
    reasoning: high          # 思考程度；值的寫法依工具
    fallback:                # 選填；主 filler 不可用（配額耗盡等）時改用這組，事先定下而非臨場選（R2）
      model: claude-fable-5-1  # filler 省略＝沿用主綁定的 filler 與 launch，只換 model／provider
  manager:                   # 執行位；省略＝本位職責歸協調位（seats/manager.md）
    filler: claude-code
    launch: agent
    instance: dfmgr
    model: claude-fable-5-1
  coordinator:               # 協調位；省略＝human（無工具，各步由人執行；對照表 orchestrators/none.md）
    filler: hermes           # hermes | paperclip | human
  approver:                  # 裁決位；人（seats/approver.md），無 model／reasoning
    filler: human

# seats.implementer.filler 的衍生投影（不是第二個自變數）：install.py 不解析 YAML，只讀這個頂層鍵
# 決定新專案建 CLAUDE.md 還是 AGENTS.md（docs/spec/install/spec.md AC-7）。與上面的值必須逐字相同，
# 由 CI 的 i5 檢查機械保證（AC-13）；改 filler 時一併改這裡。
implementer_filler: claude-code

# 本 repo 套用到哪一層流程（不是版本號；定義見 WORKFLOW.md 第 11 節）：
#   0 bootstrap（無流程，直推 main）
#   1 單線（issue → worktree → PR → 審查 → merge）
#   2 規格建版（規格先合入 main，任務從 diff 推導）
#   3 平行（多 worktree、多 coder）
stage: 1

# 誰按合併（WORKFLOW.md M2）：human | orchestrator（後者需有機械 guard 驗 M1，否則視同 human）
merge: human

# 人類文檔投影（WORKFLOW.md D3）。設定在 .mkdocs/mkdocs.yml，發布在 .github/workflows/docs.yml（跟 kit tag）。
docs:
  site: mkdocs         # none | mkdocs
  versioning: mike     # none | mike

# 自主度（WORKFLOW.md I8～I11）。獨立於 stage——ST4 明文「stage 不是權限開關」。
#   manual    機械類與方向類阻擋項都問人；人按合併（未設時的預設）
#   assisted  機械類由執行位自決；方向類由協調位技術判斷，改 scope／改 AC 要驗什麼才問人；人按合併
#   auto      方向類也由協調位自決；合併依 M2（須有機械 guard 能驗 M1，否則視同 human）
# 不可下放的事項不受本鍵影響（I11）：bypass 授權、L6、G2／G4 的唯一處置、S5。
autonomy: assisted
