# <專案名> 的 agent-devflow 設定。複製到 repo 根目錄後編輯這一份，不要改 devflow/ 下的任何檔
# ——`devflow/**` 是 kit 的，下一次安裝或升級會把你的修改覆寫或刪除。
# 只有 forge 與 seats（各職位的綁定）是自變數；其餘（PR/MR、CLI、入口檔、skills 目錄、派工方式）
# 都是衍生值，由 devflow/ 下的對照表產生，不在這裡寫（唯一例外：implementer_filler 投影，見下）。
# 規則本體：devflow/WORKFLOW.md。

forge: github          # github | gitlab | gitea（gitea 全表 ⬜，無實例前不可選）

# 對話通道（WORKFLOW.md 第 13 節 CH1～CH2；對照表 devflow/channels/）。值域：none | telegram。
# 省略＝none（人直接看 forge）。通道只承載通知、投影與提問，forge 是唯一權威（CH1）。
channel: none

# 職位綁定。職位名以 devflow/seats/ 的五個檔為準，不新增。每個職位一個 filler（填充者）：
# 工具名（對照表在 devflow/coders/、orchestrators/）或 human（由人填）。
# model／reasoning 選填，未填＝用該工具的預設；旗標怎麼寫住對照表，這裡只記意圖。
# model 是 R10 受測環境的一部分：換模型後，舊模型下驗證的格子依 R9 降為 📝。
#
# filler 只指**模型與能力的來源**（對照表在 devflow/coders/），不指啟動機制；啟動機制是 launch。
# 同一個 filler 可由不同 launch 啟動；launch: agent 時 filler 指能力對照表的歸屬，不表示實際
# 執行的是該 CLI（詳見 devflow/seats/README.md）。launch 的值域與語意：
#
#   | launch | 語意 | 可續接 | 能向人提問 | 對照表 |
#   |---|---|---|---|---|
#   | cli（省略時的預設） | 直接起 CLI 子程序（codex exec、claude -p） | ✅ | ✅ | coders/<filler>.md |
#   | agent | 協調平台上的具名實例，由平台機制喚醒；需 instance 欄 | ✅ | ✅ | orchestrators/<平台>.md |
#   | subagent | 平台內建的臨時子代理 | ❌ | ❌ | 同上 |
#   | human | 人親自執行 | — | — | orchestrators/none.md |
#
# 向後相容：launch 省略 ＝ cli，既有設定不受影響。值域刻意平台中立——平台已由
# seats.coordinator.filler 宣告，seat 欄位不重複它。
seats:
  implementer:               # 實作位
    filler: human            # claude-code | codex | human
  reviewer:                  # 審查位；建議與 implementer 異廠（R2）
    filler: human            # codex | claude-code | human
    # launch: cli            # 啟動機制：cli | agent | subagent | human
    # instance: <具名實例>     # 只在 launch: agent 時需要；平台上那個實例的名字
    # model: <工具的模型 ID>
    # reasoning: high        # 思考程度；值的寫法依工具
    # fallback:              # 選填；主 filler 不可用（配額耗盡等）時改用這組，事先定下而非臨場選（R2）
    #   model: <工具的模型 ID>   # `filler` 省略＝沿用主綁定的 filler 與 launch，只換 model／provider
    #   filler: <工具名>        # 要換廠才寫；與 implementer 同廠時，R2 建議上面的 model ≠ seats.implementer.model
  # manager:                 # 執行位（seats/manager.md）；省略＝本位職責歸協調位
  #   filler: <工具名>
  #   launch: agent
  #   instance: <具名實例>
  #   model: <工具的模型 ID>
  coordinator:               # 協調位；human＝無工具，各步由人執行（對照表 orchestrators/none.md）
    filler: human            # hermes | paperclip | human
  approver:                  # 裁決位；人（seats/approver.md），無 model／reasoning
    filler: human

# seats.implementer.filler 的衍生投影（不是第二個自變數）：install.py 不解析 YAML，只讀這個頂層鍵
# 決定新專案建 CLAUDE.md 還是 AGENTS.md（docs/spec/install/spec.md AC-7）。與上面的值必須逐字相同；
# 改 filler 時一併改這裡。只有 claude-code 會得到 CLAUDE.md，其餘一律 AGENTS.md。
implementer_filler: human

# 本專案套用到哪一層流程（不是版本號；定義見 WORKFLOW.md 第 11 節）：
#   0 bootstrap（無流程，直推 main）
#   1 單線（issue → worktree → PR → 審查 → merge）
#   2 規格建版（規格先合入 main，任務從 diff 推導）
#   3 平行（多 worktree、多 coder）
stage: 0

# 誰按合併（WORKFLOW.md M2）：human | orchestrator（後者需有機械 guard 驗 M1，否則視同 human）
merge: human

# 人類文檔投影（WORKFLOW.md D3）。
docs:
  site: none           # none | mkdocs
  versioning: none     # none | mike

# 自主度（WORKFLOW.md I8～I11）。獨立於 stage——ST4 明文「stage 不是權限開關」。
#   manual    機械類與方向類阻擋項都問人；人按合併（未設時的預設）
#   assisted  機械類由執行位自決；方向類由協調位技術判斷，改 scope／改 AC 要驗什麼才問人；人按合併
#   auto      方向類也由協調位自決；合併依 M2（須有機械 guard 能驗 M1，否則視同 human）
# 不可下放的事項不受本鍵影響（I11）：bypass 授權、L6、G2／G4 的唯一處置、S5。
autonomy: manual
