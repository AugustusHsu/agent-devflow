# 本 repo 的第一個 CI。檢查器本體與「哪幾項是關卡、分界為何」的完整說明都在 scripts/devflow_checks.py 的檔頭（issue #82 從本檔搬過去），本檔不複述。
name: devflow checks

on:
  pull_request:
    branches: [main]
  # 只有 pull_request。不要加 workflow_dispatch：它與 pull_request 產生同一個 required context
  # （`devflow-checks`），required status check 取該 context 最新一筆結論——PR 的 ❌ 之後對同一個
  # head 手動觸發一次，較晚的 success 就把失敗蓋掉，而且 dispatch 下 `i1` 還是略過的
  # （PR #76 第一輪）。正反 run 的取法見 scripts/devflow_checks.py 檔頭「升 required 的前提」。

permissions:
  contents: read

jobs:
  devflow-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # README「Phase 1 第三出口的判定方式」把升 required 的前提定為：log 要印得出
      # 「這次實際 checkout 的 commit」與「該 commit 上**那份檢查器**的 blob id」。
      # issue #82 把檢查器搬到 scripts/devflow_checks.py 之後，這裡印的是腳本的 blob：
      # 印本檔的 blob 會讓「改腳本不改 workflow」的 PR 印出同一個 blob，而檢查器已經變了，
      # README 條件一（正反兩個 run 同一份檢查器）的前提就失效。
      # 為什麼非印不可：pull_request 事件跑的是 GitHub 生成的 merge commit，PR 合併後
      # refs/pull/<N>/merge 隨之消失、該 commit 不可再取得（實測 PR #20 的 353194c：
      # git cat-file 失敗、API 404）。事後無從回推當時執行的是哪一份檢查器，
      # 「同一版 workflow 的正反兩個 run」就無法驗證。
      # blob id 是內容定址：正、反兩個 run 印出同一個 blob，才成立 README 的條件一。
      - name: 記錄受測身分
        run: |
          set -euo pipefail
          echo "checkout_sha=$(git rev-parse HEAD)"
          echo "checker_blob=$(git rev-parse HEAD:scripts/devflow_checks.py)"
          echo "event=${GITHUB_EVENT_NAME:-}"
          echo "head_ref=${GITHUB_HEAD_REF:-}"
          echo "base_ref=${GITHUB_BASE_REF:-}"
          # merge commit 事後查不到，但 PR head 查得到——判定用的是它（README 第三出口）。
          echo "pr_head_sha=${PR_HEAD_SHA:-}"
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      # 檢查器硬性要求這兩個模組，沒有 fallback 解析路徑：兩套解析＝兩種行為，
      # 而實際在 CI 跑的會是比較弱的那一套。
      #
      # 這個 step 的狀態碼只會是 0 或 2（issue #91 缺口 10）。原本是 `set -euo pipefail`，
      # pip 失敗就以 pip 的狀態碼（實測 1）結束整個 step：於是「相依裝不起來」＝環境問題，
      # 和「規則檢查判了關卡失敗」＝內容問題撞同一個號碼，而且根本到不了規則檢查 step。
      # 依 scripts/devflow_checks.py 檔頭的 exit code 守則，檢查器無法執行必須是 2。
      # 注意 GitHub 預設以 `bash -e {0}` 執行 run:，errexit 本來就是開的——所以不是「拿掉
      # set -e」就沒事，下面用一個 EXIT 守衛把任何漏出來的非零狀態碼一律收成 2。
      #
      # 版本號**不寫在本檔**（issue #91 AC-3／`I5`）：單一來源是 scripts/devflow_checks.py
      # 的 PINS，這裡只呼叫 `--print-pins`／`--check-pins`。理由見該處註解——pin 住在
      # 檢查器裡，「記錄受測身分」印出的 blob 才蓋得住「這個 run 要求哪個 parser 版本」。
      #
      # 驗的是**版本**不是 `import`（issue #91 缺口 12）：本機已有任意版本時 import 照樣
      # 成功，pinned 版就永遠裝不上去。hosted runner 恰好是 3.0.0 是巧合、不是程式保證，
      # 而 README「Phase 1 第三出口」條件一要的是正反兩個 run 跑同一份檢查器——blob 相同
      # 但 parser 版本不同，那個條件就只成立一半。
      # TODO(orchestrator)：要更嚴的供應鏈保證可改用 --require-hashes ＋ requirements 檔。
      - name: 準備檢查器相依
        run: |
          set -uo pipefail
          # 出口守衛：不管非零狀態碼是誰漏出來的（pip 的、errexit 的、set -u 的），
          # 一律收成 2。這個 step 失敗的意思永遠是「檢查器無法執行」，不可能是「關卡失敗」。
          trap 'rc=$?; if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
                  echo "💥 檢查器無法執行：準備相依時有指令以 exit $rc 結束（本 step 一律收成 2）"
                  exit 2
                fi' EXIT
          fail() { echo "💥 檢查器無法執行：$1"; exit 2; }

          pins="$(python3 scripts/devflow_checks.py --print-pins)" \
            || fail "取不到相依版本 pin（scripts/devflow_checks.py --print-pins 失敗）"
          [ -n "$pins" ] || fail "相依版本 pin 是空的"

          if ! python3 scripts/devflow_checks.py --check-pins; then
            # $pins 不加引號是刻意的：它是「一行一個 requirement」，要讓它斷成多個引數。
            python3 -m pip install --quiet --disable-pip-version-check $pins \
              || fail "pip 安裝相依失敗"
            python3 scripts/devflow_checks.py --check-pins \
              || fail "裝完之後版本仍不符 pin"
          fi
          python3 -c 'import markdown_it, yaml' \
            || fail "相依版本符合 pin，卻 import 不起來"

      - name: 規則檢查
        run: |
          set -euo pipefail
          python3 scripts/devflow_checks.py
