# 本 repo 的第一個 CI。規則本體是 devflow/WORKFLOW.md，檢查的對象也是它。
#
# G4：新規則要求的檢查器尚不存在時先列為「建議」，工具可執行且正反測試通過後才升為必需關卡。
# 本檔分兩段：必需關卡（對當前 main 全綠、每項都構造得出失敗）與建議（檢查器已可執行、
# 但 repo 內容尚未遷移）。升級靠 R9_BLOCKING 開關。
#
# ── 為什麼用真正的 markdown parser ────────────────────────────────────────
# 前兩輪審查找到的洞分成兩族，成因不同、解法也不同：
#
#   甲、「我的近似 ≠ 真正的 markdown 語意」
#       假表頭藏進 code fence、縮排的第二個定義、跨行的 reference 定義、
#       連結目標含成對括號……用正規式逼近 markdown 語法就會一直有下一個。
#       解法：改用 markdown-it-py 的 AST。是不是表格、是不是清單項、是不是程式碼、
#       連結目標是什麼，都問 parser，不用正規式猜。這一族是「消滅類別」。
#
#   乙、「檢查器問錯問題，什麼都沒看懂卻回報成功」
#       空的合格表頭 ＋ 把真資料表的欄名改掉，AST 會誠實地告訴你有兩張表，
#       但「哪一張才是對照表」AST 答不出來——換 parser 完全救不了這一族。
#       解法：fail closed。檢查器要斷言自己的前提（對照表檔案剛好一張表、
#       表要有資料列、狀態欄剛好一欄），前提不成立就失敗，不是沉默通過。
#
# ── 已知邊界（不完備的地方，寫下來讓下一個讀者知道界線在哪）──────────────
#   * frontmatter 的界定（首行 --- 到下一個 ---）仍是字面掃描；界定出來的內容才交給
#     PyYAML。這一段是慣例而非 markdown 語法，沒有 parser 可問。
#   * 「哪一張表是對照表」「狀態欄的值算不算成立」是語意問題，靠上面的 fail-closed
#     斷言逼出來，不是靠解析。對照表檔案因此被限制成剛好一張表。
#   * GitHub 的算繪器不等於 markdown-it；兩者對極端輸入可能有差異。
#   * 只看受版控的 .md。非 markdown 檔、PR body、commit 訊息都不在範圍內。
#   * required check 由 PR 分支上的 workflow 定義產生（G5）：想繞過的人可以直接改本檔。
#     本檢查器擋的是失誤，不是蓄意規避——後者由審查擋。
name: devflow checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  devflow-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 準備檢查器相依
        run: |
          set -euo pipefail
          # 檢查器硬性要求這兩個模組，沒有 fallback 解析路徑：兩套解析＝兩種行為，
          # 而實際在 CI 跑的會是比較弱的那一套。runner 上已有就用現成的，沒有才裝。
          # TODO(orchestrator)：要更嚴的供應鏈保證可改用 --require-hashes ＋ requirements 檔。
          if ! python3 -c 'import markdown_it, yaml' 2>/dev/null; then
            python3 -m pip install --quiet --disable-pip-version-check \
              'markdown-it-py==3.0.0' 'PyYAML==6.0.1'
          fi

      - name: 規則檢查
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          """devflow 規則檢查。exit 0 通過／1 檢查失敗／2 檢查器本身無法執行。"""
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import unquote

          try:
              import yaml
              from markdown_it import MarkdownIt
              import markdown_it
          except ImportError as e:
              print("💥 檢查器無法執行：缺少相依模組 %s" % e.name)
              sys.exit(2)

          # ── 設定 ──────────────────────────────────────────────────────────
          RULES_FILE = "devflow/WORKFLOW.md"
          TABLE_DIRS = ("devflow/forges/", "devflow/coders/", "devflow/orchestrators/")
          TABLE_HEADER = ["面向", "值", "狀態"]
          STATUS_COL = "狀態"
          # R9 的三值，用詞以 devflow/WORKFLOW.md 的 R9 為準。
          R9_STATUSES = ("✅ 可用", "📝 已宣稱", "⬜ 未測")
          # 三值後面可以接補充（R9 要求 ✅ 附驗證方式、📝 標明是哪一種），
          # 但必須是「三值 ＋ 分隔符」，不能是「✅ 可用性佳」這種黏著詞。
          R9_SEPS = " \t（(：:，,。、；;）)"
          OLD_TOKENS = ("✅ 實測", "⬜ 未實測", "⬜ 未實作")
          # 規則家族前綴的基線。實際集合是「基線 ∪ WORKFLOW.md 現有定義的前綴」：
          # 加新家族自動納入，整個家族被刪掉時基線仍擋得住懸空引用。
          BASELINE_PREFIXES = {"I", "S", "V", "L", "R", "M", "F", "C", "G", "B", "ST", "P", "D"}
          ID_RE = re.compile(r"^([A-Z]{1,4})[0-9]+$")

          # G4 升級開關。對照表依 R9 遷移完成後，把下面的 False 改成 True，
          # 建議段即成為必需關卡。環境變數只能加嚴、不能放寬，供升級前試跑。
          R9_BLOCKING = False or os.environ.get("DEVFLOW_R9_BLOCKING") == "1"

          MD = MarkdownIt("commonmark").enable("table")
          errors = []
          advisories = []


          def die(msg):
              print("💥 檢查器無法執行：%s" % msg)
              sys.exit(2)


          def err(msg, detail=()):
              errors.append(msg)
              print("  ❌ %s" % msg)
              for d in detail:
                  print("      %s" % d)


          def adv(msg, detail=()):
              # R9_BLOCKING 打開時，建議段走的是和 err 同一條路，不是另一條。
              if R9_BLOCKING:
                  err(msg, detail)
                  return
              advisories.append(msg)
              print("  📝 %s" % msg)
              detail = list(detail)
              for d in detail[:5]:
                  print("       %s" % d)
              if len(detail) > 5:
                  print("       …（另有 %d 筆同類，升為關卡後會全部列出）" % (len(detail) - 5))


          def ok(msg):
              print("  ✅ %s" % msg)


          # ── 取得受版控的檔案（NUL 分隔，檔名含空白也不會被拆開）────────────
          def tracked():
              p = subprocess.run(["git", "ls-files", "-z"], stdout=subprocess.PIPE,
                                 stderr=subprocess.PIPE)
              if p.returncode != 0:
                  die("git ls-files 失敗（exit %d）：%s"
                      % (p.returncode, p.stderr.decode("utf-8", "replace").strip()))
              out = []
              for raw in p.stdout.split(b"\0"):
                  if not raw:
                      continue
                  try:
                      out.append(raw.decode("utf-8"))
                  except UnicodeDecodeError:
                      die("受版控的檔名不是 UTF-8：%r" % raw)
              return out


          def read_text(path):
              try:
                  with open(path, encoding="utf-8") as fh:
                      return fh.read()
              except OSError as e:
                  die("讀不到 %s：%s" % (path, e))
              except UnicodeDecodeError as e:
                  die("%s 不是合法 UTF-8：%s" % (path, e))


          # ── 從 AST 取事實：不用正規式猜「這是不是表格／清單項／程式碼」──────
          def locate(lines, tok, needle=None):
              """回傳 1-based 行號。有 needle 就在 token 涵蓋的行裡找它。"""
              if not tok.map:
                  return None
              start, end = tok.map
              if needle:
                  for n in range(start, min(end, len(lines))):
                      if needle in lines[n]:
                          return n + 1
              return start + 1


          def rule_definitions(tokens, lines):
              """清單項開頭是 `ID` 的都算定義——縮排、巢狀、粗體一律算。
              寧可多認（誤報看得見）也不少認（漏報是沉默的）。"""
              out = []
              for i, t in enumerate(tokens):
                  if t.type != "list_item_open":
                      continue
                  for j in range(i + 1, len(tokens)):
                      tj = tokens[j]
                      if tj.type == "list_item_open":
                          break          # 已經進到子項，這個 item 自己沒有 inline 開頭
                      if tj.type != "inline":
                          continue
                      first = None
                      for c in tj.children or []:
                          # 粗體／斜體／連結的開標記，以及它們前後產生的空 text token，
                          # 都不算「開頭」——`R3` 被 ** 包起來仍然是定義。
                          if c.type in ("strong_open", "em_open", "s_open", "link_open"):
                              continue
                          if c.type == "text" and not c.content.strip():
                              continue
                          first = c
                          break
                      if first is not None and first.type == "code_inline":
                          content = first.content.strip()
                          if ID_RE.match(content):
                              out.append((content, locate(lines, t, "`%s`" % content)
                                          or locate(lines, t)))
                      break
              return out


          def code_spans(tokens, lines):
              """所有行內 code span。程式碼區塊裡的內容不會產生 inline token，天然排除。"""
              for t in tokens:
                  if t.type != "inline":
                      continue
                  for c in t.children or []:
                      if c.type == "code_inline":
                          content = c.content.strip()
                          yield content, (locate(lines, t, "`%s`" % content) or locate(lines, t))


          def tables_of(tokens, lines):
              out = []
              cur = sect = row = None
              for t in tokens:
                  if t.type == "table_open":
                      cur = {"line": locate(lines, t), "header": [], "header_line": None,
                             "body": []}
                  elif t.type == "table_close":
                      if cur is not None:
                          out.append(cur)
                      cur = sect = row = None
                  elif t.type == "thead_open":
                      sect = "head"
                  elif t.type == "tbody_open":
                      sect = "body"
                  elif t.type == "tr_open":
                      row = {"line": locate(lines, t), "cells": []}
                  elif t.type == "tr_close":
                      if cur is not None and row is not None:
                          if sect == "head":
                              cur["header"] = row["cells"]
                              cur["header_line"] = row["line"]
                          else:
                              cur["body"].append(row)
                      row = None
                  elif t.type == "inline" and row is not None:
                      row["cells"].append(t.content.strip())
              return out


          def link_targets(tokens, env, lines):
              """行內連結、圖片、以及未被使用的 reference 定義。跨行、成對括號、
              角括號形式都由 parser 處理，不是我在猜。"""
              out = []
              for t in tokens:
                  if t.type != "inline":
                      continue
                  ln = locate(lines, t)
                  for c in t.children or []:
                      if c.type == "link_open":
                          href = c.attrGet("href")
                          if href:
                              out.append((href, ln))
                      elif c.type == "image":
                          src = c.attrGet("src")
                          if src:
                              out.append((src, ln))
              for label, ref in (env.get("references") or {}).items():
                  href = (ref or {}).get("href")
                  if not href:
                      continue
                  ln = None
                  for n, line in enumerate(lines):
                      if line.lstrip().lower().startswith("[%s]:" % label.lower()):
                          ln = n + 1
                          break
                  out.append((href, ln))
              return out


          def unclosed_fence(tokens, lines):
              """fence token 的最後一行不是合格的收尾標記，就是沒關閉。用 parser 自己的切分。
              收尾標記必須同字元、且不短於開頭——```` 開就不能用 ``` 關。"""
              for t in tokens:
                  if t.type != "fence" or not t.map:
                      continue
                  end = t.map[1]
                  if end < 1 or end > len(lines):
                      return t.map[0] + 1
                  cand = lines[end - 1].strip()
                  mark = t.markup or "```"
                  if not cand or set(cand) != {mark[0]} or len(cand) < len(mark):
                      return t.map[0] + 1
              return None


          # ── frontmatter：界定是字面掃描（慣例，非 markdown 語法），值交給 PyYAML ──
          class DupKeyLoader(yaml.SafeLoader):
              pass


          def _no_dup(loader, node, deep=False):
              seen = []
              for k, _v in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      raise yaml.YAMLError("重複的 key：%r" % (key,))
                  seen.append(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep)


          DupKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _no_dup)


          def frontmatter(lines):
              """回傳 ('none'|'unclosed'|'ok', 內容字串)。"""
              if not lines or lines[0].strip() != "---":
                  return "none", ""
              for j in range(1, len(lines)):
                  if lines[j].rstrip() in ("---", "..."):
                      return "ok", "\n".join(lines[1:j])
              return "unclosed", ""


          # ── 前置 sanity：不在 repo 內或抓不到檔案時要炸掉，不能靜默跳過 ────
          files = tracked()
          md_files = [f for f in files if f.endswith(".md")]
          table_files = sorted(f for f in md_files if f.startswith(TABLE_DIRS))
          if not files:
              die("git ls-files 沒有回傳任何受版控的檔案（不在 git work tree 內？）")
          if RULES_FILE not in files:
              die("找不到受版控的 %s，repo 佈局與檢查器假設不符" % RULES_FILE)
          if not table_files:
              die("在 %s 下找不到任何對照表" % "／".join(TABLE_DIRS))
          print("檢查器：python %s／markdown-it-py %s／PyYAML %s／受版控 md %d 個／對照表 %d 個"
                % (sys.version.split()[0], markdown_it.__version__, yaml.__version__,
                   len(md_files), len(table_files)))

          docs = {}
          for f in md_files:
              text = read_text(f)
              lines = text.split("\n")
              env = {}
              try:
                  tokens = MD.parse(text, env)
              except Exception as e:
                  die("markdown-it 解析 %s 失敗：%s" % (f, e))
              docs[f] = {"lines": lines, "tokens": tokens, "env": env}

          print()
          print("── 0. markdown 的 fenced code block 都有關閉")
          bad_fence = []
          for f in sorted(docs):
              n = unclosed_fence(docs[f]["tokens"], docs[f]["lines"])
              if n:
                  bad_fence.append((f, n))
          if bad_fence:
              for f, n in bad_fence:
                  err("%s:%d 的 fenced code block 沒有關閉" % (f, n))
          else:
              ok("%d 個 md 檔的 code fence 都成對" % len(md_files))

          print()
          print("── 1. V1：frontmatter version 為四碼 a.b.c.d")
          VER_RE = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$")
          SPEC_RE = re.compile(r"^docs/spec/[^/]+/spec\.md$")
          for f in md_files:
              required = (f == RULES_FILE) or bool(SPEC_RE.match(f))
              state, fm = frontmatter(docs[f]["lines"])
              if state == "unclosed":
                  err("%s 的 frontmatter 沒有關閉" % f)
                  continue
              if state == "none":
                  if required:
                      err("%s 缺 frontmatter（V1／S1）" % f)
                  continue
              try:
                  data = yaml.load(fm, Loader=DupKeyLoader)
              except yaml.YAMLError as e:
                  # 重複 key（含 "version" 這種加引號的寫法）在這裡就被擋下來。
                  err("%s 的 frontmatter 不是合法 YAML：%s"
                      % (f, str(e).strip().replace("\n", " ")))
                  continue
              if data is None:
                  if required:
                      err("%s 的 frontmatter 是空的（V1／S1）" % f)
                  continue
              if not isinstance(data, dict):
                  err("%s 的 frontmatter 不是 mapping" % f)
                  continue
              if "version" not in data:
                  if required:
                      err("%s 的 frontmatter 缺 version（V1／S1）" % f)
                  continue
              value = data["version"]
              if not isinstance(value, str):
                  err("%s version=%r 不是字串（四碼要加引號或寫成 a.b.c.d）" % (f, value))
                  continue
              if VER_RE.match(value):
                  ok("%s version=%s" % (f, value))
              else:
                  err("%s version=「%s」不是四碼 a.b.c.d（V1）" % (f, value))

          print()
          print("── 2. 規則 ID 無重複定義（%s）" % RULES_FILE)
          rd = docs[RULES_FILE]
          defined = {}
          for rid, line in rule_definitions(rd["tokens"], rd["lines"]):
              defined.setdefault(rid, []).append(line)
          dups = {k: v for k, v in defined.items() if len(v) > 1}
          if dups:
              for rid in sorted(dups):
                  err("規則 ID `%s` 被定義 %d 次" % (rid, len(dups[rid])),
                      ["%s:%s:%s" % (RULES_FILE, n, rd["lines"][n - 1].strip())
                       for n in dups[rid] if n])
          elif not defined:
              err("在 %s 找不到任何規則定義，檢查器的假設可能已與檔案脫節" % RULES_FILE)
          else:
              ok("%d 條規則 ID，無重複定義" % len(defined))

          print()
          print("── 3. 規則 ID 無懸空引用（md 內的 `ID` 都要有定義）")
          prefixes = set(BASELINE_PREFIXES)
          for rid in defined:
              prefixes.add(ID_RE.match(rid).group(1))
          refs = {}
          nref = 0
          for f in md_files:
              for content, line in code_spans(docs[f]["tokens"], docs[f]["lines"]):
                  m = ID_RE.match(content)
                  if not m or m.group(1) not in prefixes:
                      continue
                  nref += 1
                  refs.setdefault(content, []).append((f, line))
          dangling = sorted(r for r in refs if r not in defined)
          if dangling:
              for rid in dangling:
                  err("引用了未定義的規則 ID `%s`" % rid,
                      ["%s:%s:%s" % (f, n, docs[f]["lines"][n - 1].strip() if n else "?")
                       for f, n in refs[rid]])
          else:
              ok("%d 處引用、%d 個相異 ID（含 %s 的定義行本身），全部有定義"
                 % (nref, len(refs), RULES_FILE))

          print()
          print("── 4. 對照表的形狀（fail closed：看不懂就失敗，不是沉默通過）")
          # 這一節的每條斷言都是「檢查器沒看懂這個檔案」的絆線。放寬任何一條，
          # 真資料就可以躲進檢查不到的表裡（第二輪的洞 1 就是這樣來的）。
          std_table = {}
          for f in table_files:
              d = docs[f]
              tables = tables_of(d["tokens"], d["lines"])
              if len(tables) != 1:
                  err("%s 必須剛好有一張表，實際有 %d 張" % (f, len(tables)),
                      ["%s:%s 表頭=%s（%d 個資料列）"
                       % (f, t["line"], " | ".join(t["header"]), len(t["body"]))
                       for t in tables] or ["（整個檔案找不到任何表格）"])
                  continue
              t = tables[0]
              missing = [h for h in TABLE_HEADER if h not in t["header"]]
              if missing:
                  err("%s:%s 的表頭缺少 %s（實際表頭：%s）"
                      % (f, t["header_line"], "／".join(missing), " | ".join(t["header"])))
                  continue
              if t["header"].count(STATUS_COL) != 1:
                  err("%s:%s 有 %d 個「%s」欄，無法判定哪一欄才是狀態"
                      % (f, t["header_line"], t["header"].count(STATUS_COL), STATUS_COL))
                  continue
              if not t["body"]:
                  err("%s:%s 的表沒有任何資料列" % (f, t["header_line"]))
                  continue
              col = t["header"].index(STATUS_COL)
              short = [r for r in t["body"] if len(r["cells"]) <= col]
              if short:
                  err("%s 有 %d 列缺狀態欄" % (f, len(short)),
                      ["%s:%s 只有 %d 欄" % (f, r["line"], len(r["cells"])) for r in short])
                  continue
              std_table[f] = (t, col)
              ok("%s:%s 一張表、%d 個資料列、狀態欄在第 %d 欄"
                 % (f, t["header_line"], len(t["body"]), col + 1))

          print()
          print("── 5. markdown 相對連結指向存在的路徑")
          SCHEME = re.compile(r"^[A-Za-z][A-Za-z0-9+.\-]*:")
          broken = []
          nlink = 0
          for f in md_files:
              d = docs[f]
              base = os.path.dirname(f)
              for target, line in link_targets(d["tokens"], d["env"], d["lines"]):
                  if target.startswith("#") or SCHEME.match(target):
                      continue
                  path = unquote(target.split("#", 1)[0])
                  if not path:
                      continue
                  nlink += 1
                  full = path[1:] if path.startswith("/") else os.path.join(base, path)
                  full = os.path.normpath(full)
                  if full.startswith(".."):
                      broken.append("%s:%s -> %s（逃出 repo 之外）" % (f, line, target))
                  elif not os.path.exists(full):
                      broken.append("%s:%s -> %s" % (f, line, target))
          if broken:
              err("有相對連結指向不存在或 repo 之外的路徑", broken)
          else:
              ok("%d 條相對連結（含 reference 定義、圖片）都指得到" % nlink)

          print()
          print("── R9：對照表狀態欄取三值之一（%s）" % (
              "必需關卡" if R9_BLOCKING else "建議，G4，本輪不阻擋"))
          # 檢查器已可執行且正反測試通過，但對照表的狀態欄還沒依 R9 遷移到三值，
          # 而 devflow/ 不在加這支 CI 的 write scope 內：現在設成關卡會擋死每個 PR。
          # 遷移完成後把上面的 R9_BLOCKING 改成 True，adv() 走的就是 err() 那條路。
          def status_ok(cell):
              for tok in R9_STATUSES:
                  if cell == tok:
                      return True
                  if cell.startswith(tok) and cell[len(tok)] in R9_SEPS:
                      return True
              return False

          r9_clean = bool(std_table)
          for f in table_files:
              if f not in std_table:
                  r9_clean = False        # 第 4 節已判失敗，這裡不重複報
                  continue
              t, col = std_table[f]
              bad = [r for r in t["body"] if not status_ok(r["cells"][col])]
              if bad:
                  r9_clean = False
                  adv("%s 有 %d 列的狀態欄不是 %s" % (f, len(bad), "／".join(R9_STATUSES)),
                      ["%s:%s 狀態欄=「%s」" % (f, r["line"], r["cells"][col]) for r in bad])
              # 表格以外的敘述句也會宣告舊的二值制度，一併報。
              body_lines = {r["line"] for r in t["body"]} | {t["header_line"]}
              prose = ["%s:%d:%s" % (f, n + 1, line.strip())
                       for n, line in enumerate(docs[f]["lines"])
                       if (n + 1) not in body_lines and any(o in line for o in OLD_TOKENS)]
              if prose:
                  r9_clean = False
                  adv("%s 的敘述句仍用二值用語" % f, prose)
          if r9_clean:
              ok("對照表狀態欄全部合 R9"
                 + ("" if R9_BLOCKING else " —— 可把 R9_BLOCKING 改成 True 升為必需關卡（G4）"))

          print()
          if errors:
              print("===== 必需關卡失敗（%d 項）=====" % len(errors))
              for m in errors:
                  print("  ❌ %s" % m)
              sys.exit(1)
          print("===== 必需關卡全部通過 =====")
          if advisories:
              print("（另有 %d 項建議，依 G4 本輪不阻擋）" % len(advisories))
          PY
