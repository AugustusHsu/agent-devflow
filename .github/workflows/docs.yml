# 人類站發布（WORKFLOW.md D3：版本跟 kit release）。mike 把每個 kit tag 建成站的一個版本，推到 gh-pages 分支；
# GitHub Pages 從 gh-pages 根目錄供應。gh-pages 是產物分支，不走 PR（I3 管的是 main）。
#
# 兩個觸發：
#   push tag v*        —— 新 release 自動建版（tag 的內容就是站的內容；V5 保證 tag 不移動）。
#   workflow_dispatch  —— 回填既有 tag（如 v0.0.0.1 在本 workflow 之前就已發）。工具鏈取自觸發時的 ref
#                        （main 上的 .mkdocs/），內容取自指定 tag：`git checkout <tag> -- <文檔路徑>`。
#                        這就是為什麼不能直接 checkout tag——舊 tag 上沒有 .mkdocs/。
# 不加 push: branches: [main]：站的版本跟 tag，不跟 main（D3）。
name: docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建版的 kit tag（如 v0.0.0.1）；必須已存在於遠端"
        required: true
        type: string

permissions:
  contents: write   # mike 推 gh-pages

concurrency:
  group: docs-gh-pages   # gh-pages 是單一分支，兩個 deploy 同時 push 會互相覆蓋
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0          # mike 需要 gh-pages 分支歷史；回填需要 tag

      - name: 決定版本與內容來源
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            git rev-parse -q --verify "refs/tags/${tag}^{commit}" >/dev/null \
              || { echo "💥 tag ${tag} 不存在於遠端"; exit 2; }
            # 回填：工具鏈留在目前 ref，文檔內容換成該 tag 的。
            # 只換文檔路徑，不換 .mkdocs/ 與 .github/。tag 上若沒有某路徑（早期版本）就略過。
            for p in README.md devflow docs; do
              if git cat-file -e "${tag}:${p}" 2>/dev/null; then
                git rm -rq --cached "${p}" 2>/dev/null || true
                rm -rf "${p}"
                git checkout -q "${tag}" -- "${p}"
              fi
            done
          fi
          case "${tag}" in v[0-9]*.[0-9]*.[0-9]*.[0-9]*) ;; *) echo "💥 tag 不是 v<a.b.c.d>：${tag}"; exit 2;; esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "版本 ${tag}（${{ github.event_name }}）；內容 commit $(git rev-parse --short "${tag}")"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 安裝站工具鏈（pin 見 .mkdocs/requirements.txt）
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check -r .mkdocs/requirements.txt
          python3 .mkdocs/hooks/test_gfm_table_pipes.py
          mkdocs --version; mike --version

      - name: 建版並推 gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `latest` 別名永遠指向最後部署的版本；四碼版本排序由 mike 處理（版本選單）。
          mike deploy -F .mkdocs/mkdocs.yml --push --update-aliases "${{ steps.ver.outputs.tag }}" latest
          mike set-default -F .mkdocs/mkdocs.yml --push latest
          echo "已推 gh-pages：$(git ls-remote --heads origin gh-pages | cut -c1-7)"
